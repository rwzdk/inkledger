<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1f2b"/>
      <stop offset="1" stop-color="#0c0d12"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c376"/>
      <stop offset="1" stop-color="#c98f35"/>
    </linearGradient>
    <linearGradient id="hairline" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c376" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#c98f35" stop-opacity="0.18"/>
    </linearGradient>
  </defs>
  <!-- 墨色卡面 -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect x="6" y="6" width="116" height="116" rx="23" fill="none" stroke="url(#hairline)" stroke-width="1.5"/>
  <!-- 墨 · 金字 -->
  <text
    x="64" y="90" text-anchor="middle"
    font-family="'Songti SC','Noto Serif SC','Source Han Serif SC','SimSun',serif"
    font-size="66" font-weight="700" fill="url(#gold)"
  >墨</text>
  <!-- 账线 · 落墨一点 -->
  <line x1="30" y1="106" x2="86" y2="106" stroke="url(#gold)" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.9"/>
  <circle cx="97" cy="106" r="3.4" fill="url(#gold)"/>
</svg>
